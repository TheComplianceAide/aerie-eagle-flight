<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>Your flight ticket · Aerie</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #10221f; color: #fbf4df; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
    main { box-sizing: border-box; width: min(100%, 36rem); padding: 2rem; }
    .brand { color: #efd092; letter-spacing: .23em; font-size: .85rem; font-weight: 700; }
    h1 { margin: 1.6rem 0 .45rem; font: 2.4rem/1.1 Georgia, serif; }
    p { margin: .65rem 0 1.2rem; }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; }
    a { color: #efd092; text-underline-offset: .2em; }
    button { padding: .65rem 1rem; background: #efd092; color: #172723; border: 0; border-radius: .45rem; font: inherit; font-weight: 700; cursor: pointer; }
    :focus-visible { outline: .15rem solid #fff; outline-offset: .2rem; }
  </style>
  <script defer src="confirm.js?v=payment-link"></script>
</head>
<body>
  <main>
    <span class="brand">AERIE</span>
    <h1>Your flight ticket</h1>
    <p id="status" role="status" aria-live="polite">Checking your ticket with Aerie…</p>
    <noscript><p>Enable JavaScript to check automatically, or restore your ticket with your checkout email.</p></noscript>
    <nav aria-label="Ticket help">
      <button type="button" id="retry" hidden>Check again</button>
      <a href="../#restore-ticket">Restore ticket</a>
      <a href="../help/">Purchase help</a>
    </nav>
  </main>
</body>
</html>
